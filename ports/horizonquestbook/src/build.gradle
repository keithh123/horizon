plugins { id 'net.neoforged.moddev' }
ext { modId = 'horizon_questbook'; modVersion = '1.0.0-neoforge.1.21.1' }
group = 'dev.horizon'
apply from: '../../_gradle/port.gradle'
def jars = System.getenv('PH_CACHE') ?: "${System.getProperty('user.home')}/.cache/project-horizon/jars"
repositories { mavenCentral(); maven { url = 'https://maven.neoforged.net/releases' } }
dependencies {
    compileOnly files("${jars}/heracles-neoforge-1.21.1-2.0.3.jar", "${jars}/resourcefullib-neoforge-1.21-3.0.12.jar", "${jars}/extracted/olympus-neoforge-1.21-1.0.19.jar")
    compileOnly 'org.spongepowered:mixin:0.8.5'
}
